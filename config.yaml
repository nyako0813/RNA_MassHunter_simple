# Sample configuration for the RNA_MassHunter simple pipeline.
# Copy this file and fill in sequence.sequence / input.mzml_path before running.
# See docs/design/RNA_MassHunter_再設計_実装仕様書.md §9 for the full field reference.

project:
  name: "RNA_MassHunter_simple"
  output_dir: "output"
  log_dir: "logs"

input:
  mzml_path: "data/input/19 Gln2h.mzML"

sequence:
  name: "target_tRNA^Gln2h"
  type: "RNA"
  # Set to a data/trna_library.yaml id (see `python main.py --list-trna`)
  # to auto-fill sequence/anticodon/wobble_position below instead of pasting
  # them manually.
  trna_type: ""
  sequence: "AGUCCUGUAGGGUAGUGGUCAAUCCUUCGGGCCUUUGGAGCCCGGGACAGCGGUUCGAAUCCGCUCAGGACUA"
  anticodon: ""
  wobble_position: null

instrument:
  polarity: "negative"

cca_processing:
  enabled: true
  registered_sequence_cca_mode: "EXCLUDES_CCA"

digestion:
  enabled: true
  enzyme: "RNase_T1"
  digestion_mode: "specific"
  missed_cleavages: 1
  min_length: 2
  max_length: null
  include_terminal_forms: true
  allow_partial_digestion: true
  allow_nonspecific_cleavage: false

alkaline_phosphatase:
  enabled: false
  assume_complete: false
  allow_residual_phosphate: true
  allow_cyclic_phosphate: true

fragment_mapping:
  enabled: true
  mz_tolerance_ppm: 10
  min_charge: 1
  max_charge: 8
  polarity: "auto"

ms1_peak_extraction:
  rt_min: null
  rt_max: null
  # §24.5: mz_min: 500 assumes oligomer fragments. If digestion.enzyme is
  # "Nuclease_P1" (P1 complete-digestion mode), lower this to ~100-150 —
  # free nucleoside masses run ~230-370 Da (up to ~450 Da phosphorylated),
  # and simple_pipeline.py logs a WARNING if mz_min stays >= 400 in that mode.
  mz_min: 500
  mz_max: 3000
  intensity_threshold: 1000
  # §14B: profile-mode mzML produces several split points per true ion;
  # merge them (same scan, within merge_tolerance_ppm) before anything
  # downstream sees them. Set merge_profile_points: false to disable.
  merge_profile_points: true
  merge_tolerance_ppm: 10
  # §14C: also collapse the same ion's repeated per-scan detections across
  # up to merge_max_scan_gap consecutive scans. 2 is provisional — check it
  # against this dataset's actual gap distribution (see chat/§14C notes).
  merge_across_scans: true
  merge_max_scan_gap: 2

ms2_annotation:
  enabled: true
  mz_tolerance_ppm: 20
  min_peak_intensity: 10
  min_relative_intensity_percent: 1.0
  max_peaks_per_spectrum: 500
  precursor_match_tolerance_ppm: 20
  use_theoretical_fragments: true
  ion_series: ["d", "w", "a", "z"]
  charge_states: [1]
  min_ion_length: 1
  max_ion_length: null

formula_candidate:
  enabled: true
  max_total_atoms: 7
  elements: ["C", "H", "N", "O", "P", "S", "Se"]
  element_limits: {C: 3, H: 7, N: 3, O: 4, P: 1, S: 1, Se: 1}
  mass_tolerance_da: 0.01
  max_candidates_per_match: 10
  include_zero_delta_as_match: true

# 2026-09-02訂正: ピーク探索の主フィルタは max_delta_da（絶対質量幅, Da）。
# mz_tolerance_ppmは使わない（狭いppm窓では実際の修飾を検出できないため）。
# min_charge/max_charge/polarityはfragment_mappingを流用する。
# 詳細: docs/design/RNA_MassHunter_再設計_実装仕様書.md §9.2, §12.5
mass_comparison:
  enabled: true
  max_delta_da: 300
  max_matches_per_fragment: 50
  # §24 (Phase 10): used only in P1 complete-digestion mode
  # (digestion.enzyme: "Nuclease_P1"), a narrow ppm match against known
  # nucleoside masses instead of the wide max_delta_da search.
  nucleoside_mz_tolerance_ppm: 10

# 修飾仮説の理論質量チェック (claude_code/hypothesis_mass_check_spec.md)。
# 「この仮説の理論質量は生ピークに存在するか」を Yes/No で確認するだけで、
# 観測質量からの自動同定はしない。結果は Excel の 07b_Hypothesis_Check シート。
# 仮説は次の2つをマージして照合する:
#   - sequence.trna_type で選んだtRNAの data/trna_library.yaml
#     conserved_modifications（既定: position 15 = G+ / archaeosine、要生物学的最終確認）
#   - 下の targets（今回だけ追加したい代替仮説）
# 仮説が1件も無ければシートは作られない。
hypothesis_check:
  enabled: true
  mass_tolerance_ppm: 15
  max_charge: 4
  targets: []
  # targets の書き方（name は任意。label / components / base のどれか1つ）:
  #   - name: "G15 = unmodified G"            # カタログの label を直接指定
  #     label: "G"
  #   - name: "m2,2G-PT-U dinucleotide"       # ジヌクレオチド（5'/3'は区別しない）
  #     components: ["m2,2G", "U"]
  #     linkage: "phosphorothioate"           # または "phosphodiester"（省略時）
  #   - name: "cnm5s2U+O+S"                   # 塩基 + 元素付加
  #     base: "cnm5s2U"
  #     add_elements: {O: 1, S: 1}

reporting:
  excel_output: true
  output_filename: "RNA_MassHunter_simple_report.xlsx"
  max_excel_rows_per_sheet: 100000
  truncate_large_sheets: true

visualization:
  enabled: true
