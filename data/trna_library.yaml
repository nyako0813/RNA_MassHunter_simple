# Methanosarcina acetivorans C2A tRNA library (gtRNAdb-derived), 58 entries.
# Generated from data/methanosarcina_acetivorans_c2a_trna.xlsx — see
# tools/tRNA種類選択による配列自動入力機能_実装仕様書.md for the field reference.
# `sequence`/`anticodon` are RNA (U) notation; `anticodon_gene_notation` keeps
# the source table's T notation for reference.
#
# conserved_modifications: per-tRNA default modification hypotheses checked
# against the raw MS1 peaks by rna_masshunter/hypothesis_check.py when
# sequence.trna_type selects the entry.
#   position                 1-based running number on `sequence` (not the
#                            standard/Sprinzl number).
#   modification             a single label from data/modifications.yaml, or
#   modification_candidates  a list of such labels (mutually exclusive
#                            hypotheses for the same position; each is
#                            checked independently).
#   confidence               confirmed        directly detected in this
#                                             species/strain (e.g. agmatidine)
#                            high_probability inferred from a general rule;
#                                             not confirmed per tRNA
# Regenerate with tools/add_conserved_modifications.py (idempotent; see
# claude_code/conserved_modifications_confidence_tier_spec.md). The G+ (15)
# and C+ (Ile2 wobble) entries are hand-curated inputs to that script; the
# modification_candidates entries are rebuilt from base/position rules.
#
# 修正履歴: tRNA-Ala-TGC-1-1 の wobble_position は 37 と誤っていたため 34 に修正した
# （アンチコドン UGC は配列の34-36番目。レビュー中に発見された既存データの不整合）。
# 他の57件は wobble_position と配列上のアンチコドンが一致することを確認済み。
